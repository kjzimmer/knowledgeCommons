# Holon's settings: provider, model and limits. The provider interface reads this; agent code does not name a
# provider. A role is running only when its status is "running".
roles:
  ask:
    status: running
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    maxTokens: 6000
    maxToolRounds: 6
  discuss:
    provider: anthropic
    model: claude-sonnet-5-5
    status: not built in the concept demo
note: "Model per brief v0.2 section 12. Every call records provider, model and instruction version."
